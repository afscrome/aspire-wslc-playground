name: Dotnet Build and Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test with WSL Containers
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      WSL_UTF8: '1'

    steps:
      - uses: actions/checkout@v7

      - name: WSL diagnostics before upgrading
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          Write-Host 'wsl --version (before upgrade)'
          wsl --version
          Write-Host "wsl --version exit code: $LASTEXITCODE"
          $wslcCommand = Get-Command wslc -ErrorAction SilentlyContinue
          Write-Host "Get-Command wslc exists: $($null -ne $wslcCommand)"
          if ($wslcCommand) {
            $wslcCommand | Format-List Name, Source, Version
            Write-Host 'wslc version (before upgrade)'
            wslc version
            Write-Host "wslc version exit code: $LASTEXITCODE"
          } else {
            Write-Host 'wslc version: unavailable before upgrade'
          }
          $global:LASTEXITCODE = 0

      - name: Setup .NET 11 Preview 2
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100-preview.2.26159.112'

      - name: Install stable WSL
        run: |
          wsl --update --web-download
          if ($LASTEXITCODE -ne 0) { throw "WSL upgrade failed: $LASTEXITCODE" }
          wsl --version
          if ($LASTEXITCODE -ne 0) { throw "WSL version check failed: $LASTEXITCODE" }
          $wslDirectory = Join-Path $env:ProgramFiles 'WSL'
          $env:PATH = "$wslDirectory;$env:PATH"
          $wslDirectory | Out-File $env:GITHUB_PATH -Append
          Get-Command wslc | Format-List Name, Source, Version
          wslc version
          if ($LASTEXITCODE -ne 0) { throw "WSLc version check failed: $LASTEXITCODE" }
          wslc info
          if ($LASTEXITCODE -ne 0) { throw "WSLc runtime check failed: $LASTEXITCODE" }

      - name: Restore
        run: |
          New-Item -ItemType Directory -Force artifacts/binlogs | Out-Null
          dotnet restore AspireSample.sln --verbosity minimal -bl:artifacts/binlogs/restore.binlog

      - name: Trust development certificate
        timeout-minutes: 2
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'aspire-dev-cert.pem'
          dotnet dev-certs https --export-path $certificatePath --format PEM
          if ($LASTEXITCODE -ne 0) { throw 'Development certificate export failed' }
          # Aspire certs trust --non-interactive leaves fresh Windows certificates untrusted.
          # Import into the machine store to avoid the current-user trust dialog.
          Import-Certificate -FilePath $certificatePath -CertStoreLocation Cert:\LocalMachine\Root -Confirm:$false
          dotnet dev-certs https --check --trust
          if ($LASTEXITCODE -ne 0) { throw 'Development certificate is not trusted' }

      - name: Build
        run: dotnet build AspireSample.sln --no-restore --verbosity minimal -p:ContinuousIntegrationBuild=true -bl:artifacts/binlogs/build.binlog

      - name: Integration tests
        timeout-minutes: 5
        run: dotnet test --solution AspireSample.sln --no-build --verbosity minimal --results-directory artifacts/testresults --output Detailed

      - name: Collect Aspire logs
        if: always()
        run: |
          $logs = Join-Path $env:USERPROFILE '.aspire/logs'
          if (Test-Path $logs) {
            Copy-Item -LiteralPath $logs -Destination artifacts/aspire-logs -Recurse -Force
          }
          wsl --version
          $wslcCommand = Get-Command wslc -ErrorAction SilentlyContinue
          if ($wslcCommand) { wslc version; wslc ps --all }
          $global:LASTEXITCODE = 0

      - name: Upload diagnostics and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-diagnostics
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
