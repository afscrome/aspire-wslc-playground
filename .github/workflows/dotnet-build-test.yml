name: Dotnet Build and Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test with WSL Containers
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      APPHOST: AspireSample.AppHost/AspireSample.AppHost.csproj

    steps:
      - uses: actions/checkout@v7

      - name: WSL diagnostics before upgrading
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          Write-Host 'wsl --version (before upgrade)'
          wsl --version
          Write-Host "wsl --version exit code: $LASTEXITCODE"
          $wslcCommand = Get-Command wslc -ErrorAction SilentlyContinue
          Write-Host "Get-Command wslc exists: $($null -ne $wslcCommand)"
          if ($wslcCommand) {
            $wslcCommand | Format-List Name, Source, Version
            Write-Host 'wslc version (before upgrade)'
            wslc version
            Write-Host "wslc version exit code: $LASTEXITCODE"
          } else {
            Write-Host 'wslc version: unavailable before upgrade'
          }
          $global:LASTEXITCODE = 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install prerelease WSL
        run: |
          wsl --update --pre-release --web-download
          if ($LASTEXITCODE -ne 0) { throw "WSL upgrade failed: $LASTEXITCODE" }
          wsl --version
          if ($LASTEXITCODE -ne 0) { throw "WSL version check failed: $LASTEXITCODE" }
          $wslDirectory = Join-Path $env:ProgramFiles 'WSL'
          $env:PATH = "$wslDirectory;$env:PATH"
          $wslDirectory | Out-File $env:GITHUB_PATH -Append
          Get-Command wslc | Format-List Name, Source, Version
          wslc version
          if ($LASTEXITCODE -ne 0) { throw "WSLc version check failed: $LASTEXITCODE" }
          wslc info
          if ($LASTEXITCODE -ne 0) { throw "WSLc runtime check failed: $LASTEXITCODE" }

      - name: Install latest daily Aspire CLI
        timeout-minutes: 10
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'aspire-install.ps1'
          Invoke-WebRequest https://aspire.dev/install.ps1 -OutFile $installer -MaximumRetryCount 3 -RetryIntervalSec 5
          $PSNativeCommandUseErrorActionPreference = $false
          $installed = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            Write-Host "Installing latest daily Aspire CLI: attempt $attempt of 5"
            try {
              # Mutable daily ZIP/checksum redirects can point to different builds.
              # Resolve the newest daily package and let the official installer use matching versioned URLs.
              $feed = Invoke-RestMethod 'https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet9/nuget/v3/index.json' -MaximumRetryCount 3 -RetryIntervalSec 5
              $packageBase = ($feed.resources | Where-Object { $_.'@type' -eq 'PackageBaseAddress/3.0.0' } | Select-Object -First 1).'@id'
              $versions = Invoke-RestMethod "${packageBase}aspire.cli/index.json" -MaximumRetryCount 3 -RetryIntervalSec 5
              $latestDaily = $versions.versions | Sort-Object { [System.Management.Automation.SemanticVersion]$_ } -Descending | Select-Object -First 1
              if (-not $latestDaily) { throw 'No daily Aspire CLI version was found' }
              Write-Host "Latest daily Aspire CLI: $latestDaily"
              # A child process lets installer errors/exit statements return to this retry loop.
              & pwsh -NoProfile -File $installer -Version $latestDaily -SkipPath
              if ($LASTEXITCODE -eq 0) {
                $installed = $true
                break
              }
              Write-Warning "Aspire installer exited with code $LASTEXITCODE."
            } catch {
              Write-Warning "Aspire installation attempt failed: $_"
            }
            if ($attempt -lt 5) {
              Write-Warning 'Retrying latest daily Aspire installation in 15 seconds.'
              Start-Sleep -Seconds 15
            }
          }
          if (-not $installed) { throw 'Aspire installation failed after 5 attempts' }
          $cliDirectory = Join-Path $env:USERPROFILE '.aspire/bin'
          $cliPath = Join-Path $cliDirectory 'aspire.exe'
          $cliDirectory | Out-File $env:GITHUB_PATH -Append
          "AspireCliPath=$cliPath" | Out-File $env:GITHUB_ENV -Append
          & $cliPath --version
          if ($LASTEXITCODE -ne 0) { throw "Aspire version check failed: $LASTEXITCODE" }

      - name: Restore
        run: |
          New-Item -ItemType Directory -Force artifacts/binlogs | Out-Null
          dotnet restore AspireSample.sln --verbosity minimal -bl:artifacts/binlogs/restore.binlog

      - name: Trust development certificate
        timeout-minutes: 2
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'aspire-dev-cert.pem'
          dotnet dev-certs https --export-path $certificatePath --format PEM
          if ($LASTEXITCODE -ne 0) { throw 'Development certificate export failed' }
          # Import into the machine store to avoid the current-user trust dialog.
          Import-Certificate -FilePath $certificatePath -CertStoreLocation Cert:\LocalMachine\Root -Confirm:$false
          dotnet dev-certs https --check --trust
          if ($LASTEXITCODE -ne 0) { throw 'Development certificate is not trusted' }

      - name: Build
        run: dotnet build AspireSample.sln --no-restore --verbosity minimal -p:ContinuousIntegrationBuild=true -bl:artifacts/binlogs/build.binlog

      - name: Start AppHost and verify WSL containers
        run: |
          try {
            aspire start --non-interactive --no-build --apphost $env:APPHOST
            if ($LASTEXITCODE -ne 0) { throw "AppHost startup failed: $LASTEXITCODE" }
            & (Join-Path $env:USERPROFILE '.aspire/bundle/dcp/dcp.exe') version
            aspire wait cache --timeout 120 --non-interactive --apphost $env:APPHOST
            if ($LASTEXITCODE -ne 0) { throw 'Redis did not become healthy' }
            aspire wait webfrontend --timeout 120 --non-interactive --apphost $env:APPHOST
            if ($LASTEXITCODE -ne 0) { throw 'Frontend did not become healthy' }
            aspire describe --non-interactive --apphost $env:APPHOST
            wslc ps --no-trunc
            if ($LASTEXITCODE -ne 0) { throw 'wslc ps failed' }
            $containers = wslc ps --format json
            if ($LASTEXITCODE -ne 0) { throw 'wslc ps --format json failed' }
            $containers | Set-Content artifacts/wslc-containers.json
            if (($containers -join "`n") -notmatch 'cache-') {
              throw 'The Redis cache container was not present in wslc ps'
            }
          } finally {
            aspire logs --tail 100 --non-interactive --apphost $env:APPHOST 2>&1 |
              Tee-Object -FilePath artifacts/resource-logs.txt
            aspire stop --non-interactive --apphost $env:APPHOST
            if ($LASTEXITCODE -ne 0) { throw 'AppHost cleanup failed' }
          }

      - name: Integration tests
        run: dotnet test --solution AspireSample.sln --no-build --verbosity minimal --results-directory artifacts/testresults --output Detailed

      - name: Collect Aspire logs
        if: always()
        run: |
          $logs = Join-Path $env:USERPROFILE '.aspire/logs'
          if (Test-Path $logs) {
            Copy-Item -LiteralPath $logs -Destination artifacts/aspire-logs -Recurse -Force
          }
          wsl --version
          $wslcCommand = Get-Command wslc -ErrorAction SilentlyContinue
          if ($wslcCommand) { wslc version; wslc ps --all }
          $global:LASTEXITCODE = 0

      - name: Upload diagnostics and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-diagnostics
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
